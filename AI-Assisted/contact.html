<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AD Rentals</title>
</head>
<body>

    <!-- Main Header with Navigation -->
    <header>
        <h1>AD Rentals</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html"><strong>Contact</strong></a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <section>
            <h2>Get In Touch</h2>
            <p>Have questions? Fill out the form below or reach out directly.</p>
            
            <!-- Contact Form -->
            <form action="#" method="POST">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <!-- Office Details -->
        <section>
            <h2>Our Office</h2>
            <address>
                <p>AD Rentals Headquarters</p>
                <p>123 Mobility Way, Suite 400</p>
                <p>Phone: (555) 019-2834</p>
                <p>Email: support@adrentals-example.com</p>
            </address>
        </section>
    </main>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 AD Rentals. All rights reserved.</p>
    </footer>

</body>
</html>
